<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0a14"/>

  <!-- Subtle inner glow top-left -->
  <circle cx="6" cy="6" r="20" fill="#00d4ff" opacity="0.06"/>

  <!-- Constellation dots -->
  <circle cx="10" cy="10" r="1.5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="54" cy="12" r="1"   fill="#8b5cf6" opacity="0.5"/>
  <circle cx="52" cy="54" r="1.5" fill="#00d4ff" opacity="0.4"/>
  <circle cx="12" cy="52" r="1"   fill="#8b5cf6" opacity="0.4"/>

  <!-- Connector lines between dots (constellation theme) -->
  <line x1="10" y1="10" x2="54" y2="12" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="54" y1="12" x2="52" y2="54" stroke="#8b5cf6" stroke-width="0.5" opacity="0.15"/>
  <line x1="52" y1="54" x2="12" y2="52" stroke="#8b5cf6" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="52" x2="10" y2="10" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Gradient border ring -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5"
        fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.7"/>

  <!-- I — vertical bar with top/bottom serifs -->
  <rect x="19" y="19" width="3" height="26" rx="1.5" fill="url(#gradText)"/>
  <rect x="16" y="19" width="9"  height="3"  rx="1.5" fill="url(#gradText)"/>
  <rect x="16" y="42" width="9"  height="3"  rx="1.5" fill="url(#gradText)"/>

  <!-- G — arc + crossbar -->
  <!-- Outer arc: full circle clip then subtract inner -->
  <path d="M45 32
             A13 13 0 1 0 33 45"
        fill="none" stroke="url(#gradText)" stroke-width="3.5"
        stroke-linecap="round"/>
  <!-- Crossbar of G -->
  <rect x="33" y="30.5" width="12" height="3" rx="1.5" fill="url(#gradText)"/>
  <rect x="42" y="30.5" width="3"  height="11" rx="1.5" fill="url(#gradText)"/>
</svg>
